[project]
name = "kiribati_tb"
version = "0.1.0"
description = "Kiribati TB screening model on summer4: a clean port and a summer2-to-summer4 conversion guide"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Romain Ragonnet" },
    { name = "David Shipman" },
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiribati_tb"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "reference/tbh|src/kiribati_tb/scenarios.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
